<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Strips Hover Effect</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="strip" style="background-color: forestgreen">
                <img
                    src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&h=600&fit=crop"
                    alt="Relax"
                />
                <div class="overlay"></div>
                <div class="strip__heading">Relax</div>
            </div>

            <div class="strip" style="background-color: khaki">
                <img
                    src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&h=600&fit=crop"
                    alt="Explore"
                />
                <div class="overlay"></div>
                <div class="strip__heading">Explore</div>
            </div>

            <div class="strip" style="background-color: dodgerblue">
                <img
                    src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=800&h=600&fit=crop"
                    alt="Travel"
                />
                <div class="overlay"></div>
                <div class="strip__heading">Travel</div>
            </div>

            <div class="strip" style="background-color: orange">
                <img
                    src="https://images.unsplash.com/photo-1484589065579-248aad0d8b13?w=800&h=600&fit=crop"
                    alt="Achieve"
                />
                <div class="overlay"></div>
                <div class="strip__heading">Achieve</div>
            </div>

            <div class="strip" style="background-color: violet">
                <img
                    src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=600&fit=crop"
                    alt="Dare"
                />
                <div class="overlay"></div>
                <div class="strip__heading">Dare</div>
            </div>
        </div>
    </body>
</html>
